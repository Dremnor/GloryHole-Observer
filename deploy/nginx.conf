# Alternative to deploy/Caddyfile for an existing nginx. Obtain the
# certificate separately (certbot --nginx).
#
# If you use this instead of Caddy, drop the `proxy` service from
# docker-compose.yml and publish the map container on 127.0.0.1:8080 instead.

server {
    listen 80;
    server_name map.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name map.example.com;

    ssl_certificate     /etc/letsencrypt/live/map.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/map.example.com/privkey.pem;

    # Tile uploads run to 100MB and a merge import to 500MB. nginx defaults to
    # 1MB, which silently breaks uploads with a 413 — this is not optional.
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The map server reads this to mark the session cookie Secure.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The live tile feed is a Server-Sent Events stream: it must not be
    # buffered, and it stays open far longer than the default read timeout.
    location /map/updates {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
    }
}
