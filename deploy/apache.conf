# Alternative to deploy/Caddyfile for a host already running Apache — the usual
# reason being another site that owns ports 80 and 443. Caddy cannot bind them
# in that case and its container stays in "Created" with no logs at all.
#
# Publish the map container on 127.0.0.1:8080 and let Apache reach it:
#
#   docker compose -f docker-compose.yml -f docker-compose.behind-proxy.yml up -d
#
# Modules (proxy_wstunnel is not needed; the live feed is SSE, not a WebSocket):
#
#   a2enmod proxy proxy_http headers ssl
#   a2ensite gloryhole-observer && systemctl reload apache2
#
# Certificate: certbot --apache -d map.example.com, which rewrites the port 80
# block below into a redirect and fills in the paths in the 443 block.

<VirtualHost *:80>
    ServerName map.example.com
    Redirect permanent / https://map.example.com/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName map.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/map.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/map.example.com/privkey.pem

    ProxyPreserveHost On
    # The map server reads this to mark the session cookie Secure. Apache adds
    # X-Forwarded-For itself, appending the client address.
    RequestHeader set X-Forwarded-Proto "https"

    # The live tile feed is a Server-Sent Events stream. Without flushpackets=on
    # Apache buffers it and the map simply stops updating, with nothing in any
    # log to say why. It also stays open far longer than the default timeout.
    ProxyPass        /map/updates http://127.0.0.1:8080/map/updates flushpackets=on timeout=86400
    ProxyPassReverse /map/updates http://127.0.0.1:8080/map/updates

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Tile uploads run to 100MB and a merge import to 500MB. Debian's Apache
    # leaves LimitRequestBody at 0 (no limit), but a hardening preset or a
    # hosting panel may not have — set it explicitly rather than find out
    # through a 413 on the first upload.
    LimitRequestBody 536870912

    ErrorLog  ${APACHE_LOG_DIR}/gloryhole-observer-error.log
    CustomLog ${APACHE_LOG_DIR}/gloryhole-observer-access.log combined
</VirtualHost>
</IfModule>
