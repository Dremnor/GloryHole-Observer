# Same as deploy/apache.conf, but with the TLS virtual host written out — for
# when the certificate already exists and you would rather not have certbot
# rewrite the configuration for you.
#
#   certbot certificates          # confirm the domain is listed
#   cp deploy/apache-ssl.conf /etc/apache2/sites-available/gloryhole-observer.conf
#   sed -i 's/map\.example\.com/your.domain/g' /etc/apache2/sites-available/gloryhole-observer.conf
#   a2ensite gloryhole-observer
#   apache2ctl configtest && systemctl reload apache2
#
# Use deploy/apache.conf instead if you have no certificate yet: it is plain
# HTTP, which is what certbot needs to see before it can issue one.
#
# Renewal still works — certbot replaces the files under /etc/letsencrypt/live
# and reloads Apache; nothing here needs to change.

<VirtualHost *:80>
    ServerName map.example.com
    Redirect permanent / https://map.example.com/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName map.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/map.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/map.example.com/privkey.pem
    # certbot's cipher and protocol settings, if it put them there.
    IncludeOptional /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    # Marks the session cookie Secure.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # The live tile feed is a Server-Sent Events stream. Without flushpackets=on
    # Apache buffers it and the map simply stops updating, with nothing in any
    # log to say why. It also stays open far longer than the default timeout.
    ProxyPass        /map/updates http://127.0.0.1:8080/map/updates flushpackets=on timeout=86400
    ProxyPassReverse /map/updates http://127.0.0.1:8080/map/updates

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Tile uploads run to 100MB and a merge import to 500MB. Debian's Apache
    # leaves LimitRequestBody at 0 (no limit), but a hardening preset or a
    # hosting panel may not have — set it explicitly rather than find out
    # through a 413 on the first upload.
    LimitRequestBody 536870912

    ErrorLog  ${APACHE_LOG_DIR}/gloryhole-observer-error.log
    CustomLog ${APACHE_LOG_DIR}/gloryhole-observer-access.log combined
</VirtualHost>
</IfModule>
